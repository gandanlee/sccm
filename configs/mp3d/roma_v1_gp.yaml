# exp000_roma_erp_train_v001 — paper §4 Main Comparison Table: V1 GP RoMa retrained on ERP.
#
# Vanilla RoMa V1 (Edstedt CVPR'24): GP coarse + TransformerDecoder classifier
# + ConvRefiner cascade. Trained on ERP dataset under Protocol B (yaw_aug=true,
# EDM-fair) for *fair external comparison* with our SCCM.
#
# This is for the paper's main comparison table (vs EDM / SphereGlue / DKM /
# RoMa V1 perspective / SPHORB) — NOT for the ablation table.
#
# Differences vs ablation/exp000_roma_vanilla (legacy Protocol A):
#   - SET   data.use_yaw_aug = true       → Protocol B (EDM-fair augmentation)
#   - SET   data.use_horizontal_flip_aug = true (unchanged)
#   - SET   loss.lat_weight_enabled = false (unchanged from V1 vanilla)
#   - KEEP  V1 architecture (no covis_gated_matching block → V1 GP fallback)
#
# Project: roma-erp-sccm  ★ paper main project
# Run id : exp000_roma_erp_train_v001

model:
  pretrained_backbone: false
  attenuate_cert: false
  # No covis_gated_matching block — build.py V1 GP fallback hits:
  #     gp16 = GP(CosKernel, T=0.2, ..., basis="fourier")
  #     decoder = Decoder(coordinate_decoder, gps, proj, conv_refiner, ...)
  # which is the V1 paper architecture.

loss:
  ce_weight: 0.01
  local_dist: {1: 4, 2: 4, 4: 8, 8: 8}
  local_largest_scale: 8
  depth_interpolation_mode: "bilinear"
  relative_depth_error_threshold: 0.05
  alpha: 0.5
  c: 1e-4
  lat_weight_enabled: false                 # vanilla V1 loss form (no cos(lat) weighting)

data:
  min_overlap_easy: 0.01
  min_overlap_hard: 0.3
  max_overlap: 1.0
  use_horizontal_flip_aug: true
  use_yaw_aug: true                         # ★ Protocol B: EDM-fair independent θ_A, θ_B

optimizer:
  encoder_lr_base: 5e-6
  decoder_lr_base: 1e-4
  weight_decay: 0.01

scheduler:
  milestone_fraction: 0.9

training:
  grad_clip_norm: 0.01
  grad_scaler_growth_interval: 1000000
  num_workers: 8
  checkpoint_dir: "runs/mp3d/roma_v1_gp/"

wandb:
  base_url: "http://localhost:8080"
  log_images_every_eval: false
  num_vis_samples: 4
